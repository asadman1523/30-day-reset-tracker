name: Apply tracker updates

on:
  push:
    branches: [main]
    paths:
      - pending_updates.json
      - scripts/apply_tracker_updates.py
      - scripts/export_dashboard_data.py
      - .github/workflows/apply-tracker-updates.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apply:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Apply and verify pending updates
        run: python scripts/apply_tracker_updates.py
      - name: Export dashboard data
        run: python scripts/export_dashboard_data.py
      - name: Commit workbook and dashboard update
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "30天重建追蹤.xlsx" pending_updates.json tracker_update_result.json dashboard-data.json
            git commit -m "Apply tracker updates"
            git pull --rebase origin main
            git push
          else
            echo "No tracker changes to commit."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4

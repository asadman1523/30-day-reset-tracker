name: Apply tracker updates

on:
  push:
    branches: [main]
    paths:
      - pending_updates.json
      - scripts/apply_tracker_updates.py
      - .github/workflows/apply-tracker-updates.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Apply and verify pending updates
        run: python scripts/apply_tracker_updates.py
      - name: Commit workbook update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No workbook changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "30天重建追蹤.xlsx" pending_updates.json tracker_update_result.json
          git commit -m "[skip ci] Apply tracker updates"
          git push

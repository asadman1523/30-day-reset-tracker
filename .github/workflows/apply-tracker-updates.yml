name: Apply tracker updates

on:
  push:
    branches: [main]
    paths:
      - pending_updates.json
      - processed_operation_ids.json
      - scripts/apply_tracker_updates.py
      - scripts/run_tracker_updates.py
      - scripts/export_dashboard_data.py
      - scripts/update_exercise_baselines.py
      - tests/**
      - .github/workflows/apply-tracker-updates.yml
  workflow_dispatch:

concurrency:
  group: tracker-updates-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Run tracker regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Apply and verify pending updates
        id: apply_updates
        continue-on-error: true
        run: python scripts/run_tracker_updates.py
      - name: Persist failure diagnostics
        if: steps.apply_updates.outcome == 'failure'
        shell: bash
        run: |
          git restore -- "30天重建追蹤.xlsx" pending_updates.json dashboard-data.json processed_operation_ids.json 2>/dev/null || true
          if [ -n "$(git status --porcelain tracker_update_result.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tracker_update_result.json
            git commit -m "Record tracker update failure"
            git pull --rebase origin main
            git push
          fi
          exit 1
      - name: Refresh exercise baselines
        if: steps.apply_updates.outcome == 'success'
        run: python scripts/update_exercise_baselines.py
      - name: Export dashboard data
        if: steps.apply_updates.outcome == 'success'
        run: python scripts/export_dashboard_data.py
      - name: Commit workbook and dashboard update
        if: steps.apply_updates.outcome == 'success'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "30天重建追蹤.xlsx" pending_updates.json processed_operation_ids.json tracker_update_result.json dashboard-data.json
            git commit -m "Apply tracker updates"
            git pull --rebase origin main
            git push
          else
            echo "No tracker changes to commit."
          fi
